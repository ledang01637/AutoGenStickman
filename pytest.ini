# pytest.ini  (đặt ở root project, cùng cấp với src/)
[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short


# ==============================================================
# Cài dependencies để chạy test:
