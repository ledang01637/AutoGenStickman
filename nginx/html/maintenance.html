<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="30">
<title>GenStickman — Đang bảo trì</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:    #FAFAF8;
    --ink:      #16171B;
    --ink-soft: #4A4B52;
    --accent:   #4C6FFF;
    --accent-soft: #E7ECFF;
    --amber:    #F5A524;
    --shadow-line: #D8D6CB;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background:
      radial-gradient(var(--shadow-line) 1px, transparent 1px) 0 0/28px 28px,
      var(--paper);
    color: var(--ink);
    font-family: 'Be Vietnam Pro', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    background: var(--paper);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 28px;
  }

  .badge-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amber);
    animation: pulse 1.6s ease-in-out infinite;
    flex-shrink: 0;
  }

  .illustration {
    width: clamp(140px, 26vw, 180px);
    height: auto;
    margin: 0 auto 20px;
    display: block;
  }

  .gear {
    transform-origin: 100px 100px;
    transform-box: view-box;
    animation: spin 7s linear infinite;
  }

  .gear-inner {
    transform-origin: 100px 100px;
    transform-box: view-box;
    animation: spin-rev 9s linear infinite;
  }

  h1 {
    font-family: 'Be Vietnam Pro', sans-serif;
    font-weight: 800;
    font-size: clamp(26px, 5vw, 34px);
    letter-spacing: -0.01em;
    margin: 4px 0 12px;
    line-height: 1.25;
  }

  h1 span {
    color: var(--accent);
  }

  p.lead {
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 auto 28px;
    max-width: 420px;
  }

  .meta-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .dots {
    display: inline-flex;
    gap: 4px;
  }

  .dots i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--ink-soft);
    display: inline-block;
    animation: blink 1.4s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: 0.2s; }
  .dots i:nth-child(3) { animation-delay: 0.4s; }

  .wordmark {
    margin-top: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--shadow-line);
  }

  .wordmark b { color: var(--ink-soft); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.8); }
  }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40%           { opacity: 1; }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes spin-rev {
    to { transform: rotate(-360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .badge-dot, .dots i, .gear, .gear-inner {
      animation: none !important;
    }
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">
      <span class="badge-dot" aria-hidden="true"></span>
      Bảo trì hệ thống
    </span>

    <svg class="illustration" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hai bánh răng đang quay, biểu tượng hệ thống đang được nâng cấp">
      <g class="gear">
        <circle cx="100" cy="100" r="46" fill="var(--paper)" stroke="var(--ink)" stroke-width="4"/>
        <g stroke="var(--ink)" stroke-width="8" stroke-linecap="round">
          <line x1="100" y1="50" x2="100" y2="38"/>
          <line x1="100" y1="150" x2="100" y2="162"/>
          <line x1="50" y1="100" x2="38" y2="100"/>
          <line x1="150" y1="100" x2="162" y2="100"/>
          <line x1="64.6" y1="64.6" x2="56" y2="56"/>
          <line x1="135.4" y1="135.4" x2="144" y2="144"/>
          <line x1="135.4" y1="64.6" x2="144" y2="56"/>
          <line x1="64.6" y1="135.4" x2="56" y2="144"/>
        </g>
        <circle cx="100" cy="100" r="46" fill="none" stroke="var(--ink)" stroke-width="4"/>
        <circle cx="100" cy="100" r="20" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="3.5"/>
      </g>

      <g class="gear-inner">
        <g transform="translate(148 60) scale(0.5)">
          <circle cx="100" cy="100" r="46" fill="var(--paper)" stroke="var(--ink)" stroke-width="6"/>
          <g stroke="var(--ink)" stroke-width="12" stroke-linecap="round">
            <line x1="100" y1="50" x2="100" y2="34"/>
            <line x1="100" y1="150" x2="100" y2="166"/>
            <line x1="50" y1="100" x2="34" y2="100"/>
            <line x1="150" y1="100" x2="166" y2="100"/>
            <line x1="64.6" y1="64.6" x2="53" y2="53"/>
            <line x1="135.4" y1="135.4" x2="147" y2="147"/>
            <line x1="135.4" y1="64.6" x2="147" y2="53"/>
            <line x1="64.6" y1="135.4" x2="53" y2="147"/>
          </g>
          <circle cx="100" cy="100" r="46" fill="none" stroke="var(--ink)" stroke-width="6"/>
          <circle cx="100" cy="100" r="18" fill="var(--ink)"/>
        </g>
      </g>
    </svg>

    <h1>Đang vặn lại vài <span>con ốc</span>...</h1>

    <p class="lead">
      GenStickman đang được nâng cấp để chạy mượt hơn.
      Bạn vui lòng uống miếng bánh ăn miếng trà chờ đợi nhé =)).
    </p>

    <div class="meta-row">
      <span>Tự kiểm tra lại</span>
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>

    <div class="wordmark"><b>GENSTICKMAN</b> · TRẠNG THÁI: BẢO TRÌ</div>
  </main>
</body>
</html>
