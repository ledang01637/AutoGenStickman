events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Gzip tăng cường
    gzip on;
    gzip_static on;   # serve .gz pre-compressed files từ Blazor publish
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript
        application/json application/xml application/rss+xml
        application/wasm application/octet-stream
        image/svg+xml font/woff font/woff2;

    upstream fastapi {
        server api:8000;
    }

    server {
        listen 80;
        server_name your-domain.com www.your-domain.com api.your-domain.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name your-domain.com www.your-domain.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        include /etc/nginx/maintenance.conf;

        root /usr/share/nginx/html;
        index index.html;

        # Pre-compressed Blazor WASM files
        location ~* \.(wasm|dll|dat)$ {
            gzip_static on;
            add_header Cache-Control "public, immutable";
            expires 1y;
            default_type application/wasm;
        }

        location /app/jobs/ {
            alias /app/jobs/;
            types {
                video/mp4  mp4;
                video/webm webm;
            }
            add_header Accept-Ranges bytes;
            add_header Cache-Control "no-cache";
            add_header Content-Disposition 'attachment';
        }

        location /_framework/ {
            gzip_static on;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /_content/ {
            gzip_static on;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(js|css|woff2|woff|svg|png|jpg|jpeg|gif|ico)$ {
            gzip_static on;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            if ($maintenance_mode = 1) {      
                return 503;
            }
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        error_page 503 /maintenance.html; 
        location = /maintenance.html {         
            root /usr/share/nginx/html;
            internal;
        }

        client_max_body_size 100M;
    }

    server {
        listen 443 ssl http2;
        server_name api.your-domain.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        include /etc/nginx/maintenance.conf; 

        location / {
            if ($maintenance_mode = 1) {      
                return 503 '{"error":"maintenance","message":"Hệ thống đang bảo trì, vui lòng quay lại sau."}';
            }
            default_type application/json; 

            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_connect_timeout  60s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
            client_max_body_size   100M;
        }
    }
}