# nginx/maintenance.conf — snippet dùng chung cho cả 2 server block
set $maintenance_mode 0;
if (-f /etc/nginx/maintenance.flag) {
    set $maintenance_mode 1;
}

# Bypass cho IP admin để test khi đang bảo trì — thay bằng IP thật của bạn
if ($remote_addr = "27.65.250.10") {
    set $maintenance_mode 0;
}